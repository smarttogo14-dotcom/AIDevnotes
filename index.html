<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDevnotes</title>
  <meta name="theme-color" content="#0b0f19">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151d2a;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #26334d;
      --danger: #ef4444;
      --success: #22c55e;
      --code-bg: #070a10;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background-color: var(--bg-card); border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.2rem; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }

    .brand { font-size: 1.2rem; font-weight: 700; color: var(--accent); cursor: pointer; }
    .header-actions { display: flex; gap: 0.6rem; }

    .btn-icon {
      background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main);
      width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center;
      align-items: center; cursor: pointer; font-size: 0.85rem;
    }

    .breadcrumb-bar {
      padding: 0.8rem 1.2rem; background-color: rgba(21, 29, 42, 0.5);
      border-bottom: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);
    }
    .breadcrumb-item { cursor: pointer; color: var(--accent); }

    main { flex: 1; padding: 1.2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    .view { display: none; }
    .view.active { display: block; }

    .ki-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .card {
      background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 0.8rem;
      padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; cursor: pointer;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card-title { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .empty-hint { color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0; }

    .detail-header {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.8rem;
      padding: 1.2rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 0.8rem;
    }

    .section-title {
      font-size: 1.1rem; color: var(--accent); margin-bottom: 0.8rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    .modules-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .module-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.8rem;
      padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; cursor: pointer;
    }
    .module-card:hover { border-color: var(--accent); }

    textarea, input, select {
      background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main);
      padding: 0.6rem; border-radius: 0.4rem; width: 100%; font-size: 0.9rem;
    }
    textarea:disabled, input:disabled, select:disabled {
      opacity: 0.7; cursor: not-allowed;
    }
    textarea.code-editor { font-family: monospace; background: var(--code-bg); color: #7dd3fc; }

    .btn-action {
      background: var(--accent); color: var(--bg-main); border: none; padding: 0.6rem 1rem;
      border-radius: 0.5rem; font-weight: bold; cursor: pointer;
    }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 0.4rem 0.8rem; border-radius: 0.4rem; cursor: pointer; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.8rem; padding: 1.2rem; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1rem; max-height: 90vh; overflow-y: auto; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .file-tag { background: var(--bg-main); border: 1px solid var(--border); padding: 0.4rem 0.6rem; border-radius: 0.4rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; }
    .file-tag a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-tag a:hover { text-decoration: underline; }
    .file-tag-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="showOverview()">AIDevnotes</div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openContextModal()">+</button>
      <button class="btn-icon" onclick="openAccountModal()">👤</button>
    </div>
  </header>

  <div class="breadcrumb-bar" id="breadcrumb">
    <span class="breadcrumb-item" onclick="showOverview()">Datenbank</span>
  </div>

  <main>
    <div id="view-overview" class="view active">
      <div class="ki-grid" id="ki-grid-container"></div>
    </div>

    <div id="view-detail" class="view">
      <div class="detail-header">
        <div style="display:flex; justify-content:space-between; align-items: center;">
          <div>
            <h1 id="detail-ki-name" class="card-title" style="font-size: 1.6rem;"></h1>
            <div id="detail-ki-meaning" style="font-size:0.85rem; color:var(--text-muted);"></div>
          </div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            <button class="btn-icon" onclick="openKIDetailModal()">✏️</button>
            <button class="btn-danger" onclick="deleteCurrentKI()">KI Löschen</button>
          </div>
        </div>
        <p id="detail-ki-desc-text" style="font-size:0.95rem; color:var(--text-main); margin-top:0.4rem; white-space: pre-wrap;"></p>
      </div>

      <div class="section-title">
        <span>Integrierte Module</span>
        <button class="btn-action" onclick="openAddModuleModal()">+ Modul</button>
      </div>
      <div class="modules-list" id="modules-container"></div>
    </div>
  </main>

  <!-- Modal Haupt-KI Details / Bearbeiten -->
  <div class="modal-overlay" id="modal-ki-detail">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color: var(--accent);">KI Details & Konfiguration</h2>
        <button class="btn-icon" id="btn-edit-ki-toggle" onclick="toggleKIEditMode()">✏️</button>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">KI Name</label>
        <input type="text" id="ki-detail-name" disabled>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Bedeutung</label>
        <input type="text" id="ki-detail-meaning" disabled>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Beschreibung</label>
        <textarea id="ki-detail-desc" rows="2" disabled></textarea>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 0.8rem;">
        <label style="font-size:0.8rem; color:var(--text-muted);">Notizen</label>
        <textarea id="ki-detail-notes" rows="3" placeholder="Zusätzliche Notizen zur KI..." disabled></textarea>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 0.8rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
          <h3 style="font-size:1rem; color:var(--accent);">KI-Anhänge</h3>
          <label class="btn-action" style="cursor:pointer; font-size:0.8rem; padding:0.3rem 0.6rem;">
            + Datei anhängen
            <input type="file" id="ki-file-uploader" style="display:none;" onchange="handleFileUpload(event)">
          </label>
        </div>
        <div id="ki-files-list" style="display:flex; flex-direction:column; gap:0.4rem;"></div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top: 1rem;">
        <button class="btn-danger" onclick="deleteCurrentKI()">KI Löschen</button>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn-danger" onclick="closeModals()">Schließen</button>
          <button class="btn-action" id="btn-save-ki" style="display:none;" onclick="saveKIDetails()">Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Modul Details / Bearbeiten -->
  <div class="modal-overlay" id="modal-module-detail">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="mod-modal-title" style="color: var(--accent);">Modul Details</h2>
        <button class="btn-icon" id="btn-edit-toggle" onclick="toggleModuleEditMode()">✏️</button>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Modul Name</label>
        <input type="text" id="mod-detail-name" disabled>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Bedeutung</label>
        <input type="text" id="mod-detail-meaning" disabled>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Notizen</label>
        <textarea id="mod-detail-notes" rows="3" placeholder="Notizen zum Modul..." disabled></textarea>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 0.8rem;">
        <h3 style="font-size:1rem; color:var(--accent); margin-bottom: 0.5rem;">Optionen</h3>
        <div class="options-grid">
          <div>
            <label style="font-size:0.8rem; color:var(--text-muted);">Status</label>
            <select id="mod-opt-status" disabled>
              <option value="Aktiv">Aktiv</option>
              <option value="Inaktiv">Inaktiv</option>
              <option value="Test">Testmodus</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.8rem; color:var(--text-muted);">Priorität</label>
            <select id="mod-opt-prio" disabled>
              <option value="Hoch">Hoch</option>
              <option value="Mittel">Mittel</option>
              <option value="Niedrig">Niedrig</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.8rem; color:var(--text-muted);">Ausführungs-Intervall</label>
            <input type="text" id="mod-opt-interval" placeholder="z.B. 5m / manuell" disabled>
          </div>
          <div>
            <label style="font-size:0.8rem; color:var(--text-muted);">Log-Level</label>
            <select id="mod-opt-loglevel" disabled>
              <option value="DEBUG">DEBUG</option>
              <option value="INFO">INFO</option>
              <option value="WARN">WARN</option>
              <option value="ERROR">ERROR</option>
            </select>
          </div>
        </div>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 0.8rem;">
        <label style="font-size:0.8rem; color:var(--text-muted);">Code / Konfiguration</label>
        <textarea id="mod-detail-code" class="code-editor" rows="5" disabled></textarea>
      </div>

      <div style="border-top: 1px solid var(--border); padding-top: 0.8rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.5rem;">
          <h3 style="font-size:1rem; color:var(--accent);">Modul-Dateien</h3>
          <label class="btn-action" style="cursor:pointer; font-size:0.8rem; padding:0.3rem 0.6rem;">
            + Datei anhängen
            <input type="file" id="mod-file-uploader" style="display:none;" onchange="handleModuleFileUpload(event)">
          </label>
        </div>
        <div id="mod-files-list" style="display:flex; flex-direction:column; gap:0.4rem;"></div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top: 1rem;">
        <button class="btn-danger" onclick="deleteCurrentModule()">Modul Löschen</button>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn-danger" onclick="closeModals()">Schließen</button>
          <button class="btn-action" id="btn-save-mod" style="display:none;" onclick="saveModuleDetails()">Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Neue KI -->
  <div class="modal-overlay" id="modal-ki">
    <div class="modal">
      <h2 style="color: var(--accent);">Neue KI-Instanz</h2>
      <input type="text" id="new-ki-name" placeholder="KI Name (z.B. JAMES)">
      <input type="text" id="new-ki-meaning" placeholder="Bedeutung">
      <textarea id="new-ki-desc" rows="3" placeholder="Beschreibung..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button class="btn-danger" onclick="closeModals()">Abbrechen</button>
        <button class="btn-action" onclick="createNewKI()">Erstellen</button>
      </div>
    </div>
  </div>

  <!-- Modal Neues Modul -->
  <div class="modal-overlay" id="modal-module">
    <div class="modal">
      <h2 style="color: var(--accent);">Neues Modul</h2>
      <input type="text" id="new-mod-name" placeholder="Modul Name (z.B. RALPH)">
      <input type="text" id="new-mod-meaning" placeholder="Bedeutung">
      <textarea id="new-mod-code" class="code-editor" rows="4" placeholder="Code / Config..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button class="btn-danger" onclick="closeModals()">Abbrechen</button>
        <button class="btn-action" onclick="addModuleToCurrentKI()">Hinzufügen</button>
      </div>
    </div>
  </div>

  <!-- Modal Account -->
  <div class="modal-overlay" id="modal-account">
    <div class="modal">
      <h2 style="color: var(--accent);">Account & Sync</h2>
      <button class="btn-action" onclick="exportData()">Backup Exportieren</button>
      <button class="btn-action" onclick="document.getElementById('import-file').click()">Backup Importieren</button>
      <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importData(event)">
      <button class="btn-danger" onclick="closeModals()">Schließen</button>
    </div>
  </div>

  <script>
    let db = JSON.parse(localStorage.getItem('james_core_db')) || [{
      id: 'ki-james', name: 'JAMES', meaning: 'Just A Modular Essential System',
      desc: 'Haupt-KI-System', notes: '', modules: [{
        id: 'mod-1', name: 'RALPH', meaning: 'Logger', code: 'type: logger', notes: '',
        options: { status: 'Aktiv', prio: 'Hoch', interval: '1m', loglevel: 'INFO' },
        files: []
      }],
      attachments: []
    }];
    let currentKIId = null;
    let currentModuleId = null;
    let isModuleEditMode = false;
    let isKIEditMode = false;

    function saveDB() {
      try {
        localStorage.setItem('james_core_db', JSON.stringify(db));
      } catch (err) {
        console.error('Speichern fehlgeschlagen:', err);
      }
    }

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function openContextModal() {
      if (currentKIId) {
        openAddModuleModal();
      } else {
        document.getElementById('modal-ki').classList.add('active');
      }
    }

    function openAddModuleModal() {
      document.getElementById('new-mod-name').value = '';
      document.getElementById('new-mod-meaning').value = '';
      document.getElementById('new-mod-code').value = '';
      document.getElementById('modal-module').classList.add('active');
    }

    function openAccountModal() {
      document.getElementById('modal-account').classList.add('active');
    }

    function showOverview() {
      currentKIId = null;
      document.getElementById('view-overview').classList.add('active');
      document.getElementById('view-detail').classList.remove('active');
      document.getElementById('breadcrumb').innerHTML = `<span class="breadcrumb-item" onclick="showOverview()">Datenbank</span>`;
      renderOverviewGrid();
    }

    function openKIDetail(id) {
      currentKIId = id;
      const ki = db.find(item => item.id === id);
      if (!ki) return;
      document.getElementById('view-overview').classList.remove('active');
      document.getElementById('view-detail').classList.add('active');
      document.getElementById('breadcrumb').innerHTML = `<span class="breadcrumb-item" onclick="showOverview()">Datenbank</span> / <span>${ki.name}</span>`;
      document.getElementById('detail-ki-name').innerText = ki.name;
      document.getElementById('detail-ki-meaning').innerText = ki.meaning;
      document.getElementById('detail-ki-desc-text').innerText = ki.desc || 'Keine Beschreibung vorhanden.';
      renderModules();
    }

    /* --- Haupt-KI Bearbeitungs-Modal Logik --- */
    function openKIDetailModal() {
      const ki = db.find(item => item.id === currentKIId);
      if (!ki) return;

      isKIEditMode = false;
      updateKIEditModeUI();

      document.getElementById('ki-detail-name').value = ki.name || '';
      document.getElementById('ki-detail-meaning').value = ki.meaning || '';
      document.getElementById('ki-detail-desc').value = ki.desc || '';
      document.getElementById('ki-detail-notes').value = ki.notes || '';

      renderKIAttachments(ki);
      document.getElementById('modal-ki-detail').classList.add('active');
    }

    function toggleKIEditMode() {
      isKIEditMode = !isKIEditMode;
      updateKIEditModeUI();
    }

    function updateKIEditModeUI() {
      const fields = ['ki-detail-name', 'ki-detail-meaning', 'ki-detail-desc', 'ki-detail-notes'];
      fields.forEach(id => document.getElementById(id).disabled = !isKIEditMode);
      document.getElementById('btn-save-ki').style.display = isKIEditMode ? 'inline-block' : 'none';
      document.getElementById('btn-edit-ki-toggle').style.background = isKIEditMode ? 'var(--accent)' : 'var(--bg-main)';
    }

    function saveKIDetails() {
      const ki = db.find(item => item.id === currentKIId);
      if (!ki) return;

      ki.name = document.getElementById('ki-detail-name').value;
      ki.meaning = document.getElementById('ki-detail-meaning').value;
      ki.desc = document.getElementById('ki-detail-desc').value;
      ki.notes = document.getElementById('ki-detail-notes').value;

      saveDB();
      openKIDetail(ki.id);
      toggleKIEditMode();
    }

    function renderKIAttachments(ki) {
      const container = document.getElementById('ki-files-list');
      container.innerHTML = '';
      if (!ki.attachments || ki.attachments.length === 0) {
        container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted);">Keine Dateien angehängt.</div>`;
        return;
      }
      ki.attachments.forEach((att, idx) => {
        container.innerHTML += `<div class="file-tag">
          <a href="${att.data}" download="${att.name}">${att.name}</a>
          <div class="file-tag-actions">
            <button class="btn-danger" style="font-size:0.7rem; padding:0.1rem 0.4rem;" onclick="deleteKIAttachment(${idx})">x</button>
          </div>
        </div>`;
      });
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      const ki = db.find(item => item.id === currentKIId);
      if (!file || !ki) { e.target.value = ''; return; }

      const reader = new FileReader();
      reader.onload = (evt) => {
        if (!ki.attachments) ki.attachments = [];
        ki.attachments.push({ name: file.name, data: evt.target.result });
        try {
          saveDB();
        } catch (err) {
          alert('Datei konnte nicht gespeichert werden (evtl. zu groß für den lokalen Speicher).');
          ki.attachments.pop();
        }
        renderKIAttachments(ki);
      };
      reader.onerror = () => alert('Datei konnte nicht gelesen werden.');
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function deleteKIAttachment(idx) {
      const ki = db.find(item => item.id === currentKIId);
      if (ki && ki.attachments) {
        ki.attachments.splice(idx, 1);
        saveDB();
        renderKIAttachments(ki);
      }
    }

    function deleteCurrentKI() {
      if (!confirm('Sicher, dass diese KI gelöscht werden soll?')) return;
      db = db.filter(item => item.id !== currentKIId);
      saveDB();
      closeModals();
      showOverview();
    }

    /* --- Übersicht --- */
    function renderOverviewGrid() {
      const container = document.getElementById('ki-grid-container');
      container.innerHTML = '';
      if (db.length === 0) {
        container.innerHTML = `<div class="empty-hint">Noch keine KI-Instanzen. Klicke oben rechts auf "+", um eine anzulegen.</div>`;
        return;
      }
      db.forEach(ki => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openKIDetail(ki.id);
        card.innerHTML = `<div class="card-title">${ki.name}</div><div>${ki.desc || ''}</div>`;
        container.appendChild(card);
      });
    }

    /* --- Module --- */
    function renderModules() {
      const ki = db.find(item => item.id === currentKIId);
      const container = document.getElementById('modules-container');
      container.innerHTML = '';
      if (!ki) return;
      if (!ki.modules || ki.modules.length === 0) {
        container.innerHTML = `<div class="empty-hint">Noch keine Module. Klicke auf "+ Modul".</div>`;
        return;
      }
      ki.modules.forEach((mod) => {
        const item = document.createElement('div');
        item.className = 'module-card';
        item.onclick = () => openModuleDetailModal(mod.id);
        item.innerHTML = `<div><b>${mod.name}</b></div><div style="font-size:0.8rem; color:var(--text-muted);">${mod.meaning || 'Keine Beschreibung'}</div>`;
        container.appendChild(item);
      });
    }

    function openModuleDetailModal(modId) {
      currentModuleId = modId;
      const ki = db.find(item => item.id === currentKIId);
      const mod = ki ? ki.modules.find(m => m.id === modId) : null;
      if (!mod) return;

      isModuleEditMode = false;
      updateModuleEditModeUI();

      document.getElementById('mod-modal-title').innerText = mod.name || 'Modul Details';
      document.getElementById('mod-detail-name').value = mod.name || '';
      document.getElementById('mod-detail-meaning').value = mod.meaning || '';
      document.getElementById('mod-detail-notes').value = mod.notes || '';
      document.getElementById('mod-detail-code').value = mod.code || '';

      const opts = mod.options || {};
      document.getElementById('mod-opt-status').value = opts.status || 'Aktiv';
      document.getElementById('mod-opt-prio').value = opts.prio || 'Mittel';
      document.getElementById('mod-opt-interval').value = opts.interval || '';
      document.getElementById('mod-opt-loglevel').value = opts.loglevel || 'INFO';

      renderModuleFiles(mod);
      document.getElementById('modal-module-detail').classList.add('active');
    }

    function toggleModuleEditMode() {
      isModuleEditMode = !isModuleEditMode;
      updateModuleEditModeUI();
    }

    function updateModuleEditModeUI() {
      const fields = ['mod-detail-name', 'mod-detail-meaning', 'mod-detail-notes', 'mod-detail-code', 'mod-opt-status', 'mod-opt-prio', 'mod-opt-interval', 'mod-opt-loglevel'];
      fields.forEach(id => document.getElementById(id).disabled = !isModuleEditMode);
      document.getElementById('btn-save-mod').style.display = isModuleEditMode ? 'inline-block' : 'none';
      document.getElementById('btn-edit-toggle').style.background = isModuleEditMode ? 'var(--accent)' : 'var(--bg-main)';
    }

    function saveModuleDetails() {
      const ki = db.find(item => item.id === currentKIId);
      const mod = ki ? ki.modules.find(m => m.id === currentModuleId) : null;
      if (!mod) return;

      mod.name = document.getElementById('mod-detail-name').value;
      mod.meaning = document.getElementById('mod-detail-meaning').value;
      mod.notes = document.getElementById('mod-detail-notes').value;
      mod.code = document.getElementById('mod-detail-code').value;
      mod.options = {
        status: document.getElementById('mod-opt-status').value,
        prio: document.getElementById('mod-opt-prio').value,
        interval: document.getElementById('mod-opt-interval').value,
        loglevel: document.getElementById('mod-opt-loglevel').value
      };

      saveDB();
      renderModules();
      document.getElementById('mod-modal-title').innerText = mod.name || 'Modul Details';
      toggleModuleEditMode();
    }

    function renderModuleFiles(mod) {
      const container = document.getElementById('mod-files-list');
      container.innerHTML = '';
      if (!mod.files || mod.files.length === 0) {
        container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted);">Keine Dateien angehängt.</div>`;
        return;
      }
      mod.files.forEach((f, idx) => {
        container.innerHTML += `<div class="file-tag">
          <a href="${f.data}" download="${f.name}">${f.name}</a>
          <div class="file-tag-actions">
            <button class="btn-danger" style="font-size:0.7rem; padding:0.1rem 0.4rem;" onclick="deleteModuleFile(${idx})">x</button>
          </div>
        </div>`;
      });
    }

    function handleModuleFileUpload(e) {
      const file = e.target.files[0];
      const ki = db.find(item => item.id === currentKIId);
      const mod = ki ? ki.modules.find(m => m.id === currentModuleId) : null;
      if (!file || !mod) { e.target.value = ''; return; }

      const reader = new FileReader();
      reader.onload = (evt) => {
        if (!mod.files) mod.files = [];
        mod.files.push({ name: file.name, data: evt.target.result });
        try {
          saveDB();
        } catch (err) {
          alert('Datei konnte nicht gespeichert werden (evtl. zu groß für den lokalen Speicher).');
          mod.files.pop();
        }
        renderModuleFiles(mod);
      };
      reader.onerror = () => alert('Datei konnte nicht gelesen werden.');
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function deleteModuleFile(idx) {
      const ki = db.find(item => item.id === currentKIId);
      const mod = ki ? ki.modules.find(m => m.id === currentModuleId) : null;
      if (mod && mod.files) {
        mod.files.splice(idx, 1);
        saveDB();
        renderModuleFiles(mod);
      }
    }

    function deleteCurrentModule() {
      if (!confirm('Sicher, dass dieses Modul gelöscht werden soll?')) return;
      const ki = db.find(item => item.id === currentKIId);
      if (ki) {
        ki.modules = ki.modules.filter(m => m.id !== currentModuleId);
        saveDB();
        renderModules();
        closeModals();
      }
    }

    /* --- Erstellen --- */
    function createNewKI() {
      const name = document.getElementById('new-ki-name').value.trim();
      if (!name) { alert('Bitte einen KI-Namen angeben.'); return; }
      const newKI = {
        id: 'ki-' + Date.now(),
        name,
        meaning: document.getElementById('new-ki-meaning').value.trim(),
        desc: document.getElementById('new-ki-desc').value.trim(),
        notes: '',
        modules: [],
        attachments: []
      };
      db.push(newKI);
      saveDB();
      document.getElementById('new-ki-name').value = '';
      document.getElementById('new-ki-meaning').value = '';
      document.getElementById('new-ki-desc').value = '';
      closeModals();
      renderOverviewGrid();
      openKIDetail(newKI.id);
    }

    function addModuleToCurrentKI() {
      const name = document.getElementById('new-mod-name').value.trim();
      const ki = db.find(item => item.id === currentKIId);
      if (!name) { alert('Bitte einen Modul-Namen angeben.'); return; }
      if (!ki) return;

      ki.modules.push({
        id: 'm-' + Date.now(),
        name,
        meaning: document.getElementById('new-mod-meaning').value.trim(),
        code: document.getElementById('new-mod-code').value,
        notes: '',
        options: { status: 'Aktiv', prio: 'Mittel', interval: '', loglevel: 'INFO' },
        files: []
      });

      saveDB();
      document.getElementById('new-mod-name').value = '';
      document.getElementById('new-mod-meaning').value = '';
      document.getElementById('new-mod-code').value = '';
      renderModules();
      closeModals();
    }

    /* --- Backup Export / Import --- */
    function exportData() {
      try {
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'james_core_backup_' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Export fehlgeschlagen:', err);
        alert('Export fehlgeschlagen.');
      }
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (!Array.isArray(imported)) throw new Error('Ungültiges Format');
          db = imported;
          saveDB();
          closeModals();
          showOverview();
          alert('Backup erfolgreich importiert.');
        } catch (err) {
          console.error('Import fehlgeschlagen:', err);
          alert('Import fehlgeschlagen: Die Datei ist kein gültiges Backup.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    /* --- Init --- */
    renderOverviewGrid();
  </script>
</body>
</html>
